name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gp1
          POSTGRES_PASSWORD: gp1_test_password
          POSTGRES_DB: gp1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gp1 -d gp1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://gp1:gp1_test_password@127.0.0.1:5432/gp1_test
      DATABASE_SSL: "false"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
